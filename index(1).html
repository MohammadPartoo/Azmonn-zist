<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  const STORAGE_KEY = 'azmoon-yar-demo-v1';
  const TYPE_LABELS = { mcq:'چهارگزینه‌ای', fill:'جای خالی', essay:'تشریحی', match:'جورکردنی' };
  const TYPE_ICONS = { mcq:'◉', fill:'＿', essay:'✎', match:'↔' };
  const toFa = value => String(value).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
  const toLatin = value => String(value).replace(/[۰-۹٠-٩]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d) >= 0 ? String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)) : String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const now = () => Date.now();
  function makeDefaultDB(){
    const t=Date.now();
    const q1='q-demo-1',q2='q-demo-2',q3='q-demo-3',q4='q-demo-4';
    return {tests:[{
      id:'demo-science',title:'آزمون نمونه علوم',subject:'علوم',className:'دهم الف',duration:25,
      startAt:t-15*60*1000,endAt:t+4*60*60*1000,published:true,shuffleQuestions:true,shuffleOptions:true,randomQuestionSet:false,questionsPerStudent:0,
      questions:[
        {id:q1,type:'mcq',text:'کدام گزینه، وظیفه اصلی ریشه گیاه را بهتر بیان می‌کند؟',points:2,options:[{id:q1+'-a',text:'جذب آب و مواد معدنی'},{id:q1+'-b',text:'ساختن دانه'},{id:q1+'-c',text:'تولید نور'},{id:q1+'-d',text:'انتقال گرده'}],correctId:q1+'-a'},
        {id:q2,type:'fill',text:'فرایندی که گیاهان با کمک نور خورشید غذا می‌سازند، چه نام دارد؟',points:2,acceptable:['فتوسنتز','photosynthesis']},
        {id:q3,type:'essay',text:'دو راهکار برای کاهش مصرف آب در مدرسه پیشنهاد کنید و کوتاه توضیح دهید.',points:4,rubric:'پاسخ تشریحی با توجه به دو راهکار مرتبط ارزیابی شود.'},
        {id:q4,type:'match',text:'هر مورد را به توضیح مناسب وصل کنید.',points:4,pairs:[{id:q4+'-1',left:'تبخیر',right:'تبدیل مایع به بخار'},{id:q4+'-2',left:'میعان',right:'تبدیل بخار به مایع'},{id:q4+'-3',left:'انجماد',right:'تبدیل مایع به جامد'}]}
      ]
    }],attempts:[],activeAttempt:null};
  }
  function loadDB(){
    try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return makeDefaultDB();const parsed=JSON.parse(raw);if(!parsed||!Array.isArray(parsed.tests)||!Array.isArray(parsed.attempts))return makeDefaultDB();return {tests:parsed.tests,attempts:parsed.attempts,activeAttempt:parsed.activeAttempt||null};}catch(_){return makeDefaultDB();}
  }
  let db=loadDB();
  function saveDB(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return true;}catch(e){console.warn(e);toast('ذخیره‌سازی محلی با محدودیت روبه‌رو شد. برای نسخه واقعی، ذخیره‌سازی امن سمت سرور لازم است.');return false;}}
  let ui={view:'home',teacherTab:'overview',teacherLogged:false,student:null,selectedTestId:null,cameraStream:null,cameraError:'',cameraStatus:'idle',consent:false,capturedPhoto:null,activeAttempt:null,resumeMode:false,currentIndex:0,selectedAttemptId:null,modal:null,testDraft:null,questionType:'mcq',qDraft:null,lastProctorEvent:0,hadFullscreen:false,resultAttemptId:null};
  const app=document.getElementById('app');
  let toastTimer=null;
  function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),3000);}
  function formatDate(ms){if(!ms)return '—';try{return new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(ms));}catch(_){return new Date(ms).toLocaleString();}}
  function dateTimeLocal(ms){const d=new Date(ms||Date.now());const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
  function statusOf(test){if(!test.published)return 'draft';const t=now();if(test.startAt&&t<test.startAt)return 'scheduled';if(test.endAt&&t>test.endAt)return 'ended';return 'open';}
  function statusLabel(status){return ({open:'در حال برگزاری',scheduled:'زمان‌بندی‌شده',ended:'پایان‌یافته',draft:'پیش‌نویس'})[status]||status;}
  function statusClass(status){return ({open:'open',scheduled:'scheduled',ended:'ended',draft:'draft'})[status]||'ended';}
  function findTest(id){return db.tests.find(t=>t.id===id);}
  function getClassOptions(){return [...new Set(['دهم الف','دهم ب','یازدهم الف',...db.tests.map(t=>t.className).filter(Boolean)])];}
  function getAttempt(id){return db.attempts.find(a=>a.id===id);}
  function shortId(value){const s=String(value||'');return s.length>4?'••••••'+s.slice(-4):s;}
  function formatRemain(ms){const seconds=Math.max(0,Math.floor(ms/1000));const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;return toFa((h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'));}
  function icon(name){const paths={shield:'<path d="M12 3 20 6v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>',camera:'<path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/>',shuffle:'<path d="M16 3h5v5"/><path d="m4 20 5-5"/><path d="m16 16 5 5"/><path d="M4 4l16 16"/><path d="M21 3 14 10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/>',check:'<path d="m5 12 4 4L19 6"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14a5 5 0 0 1 3 4.5V20"/>',alert:'<path d="M10.3 4.3 2.7 17.5A1.7 1.7 0 0 0 4.2 20h15.6a1.7 1.7 0 0 0 1.5-2.5L13.7 4.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 3h.01"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.book}</svg>`;}
  function header(){
    const inExam=ui.view==='exam';
    return `<header class="topbar"><div class="container topbar-inner"><div class="brand"><span class="brand-mark">${icon('book')}</span><span><span class="brand-name">آزمون‌یار</span><small class="brand-sub">سامانه آزمون آنلاین</small></span></div><div class="top-actions"><span class="demo-pill"><i class="demo-dot"></i> نسخه آزمایشی</span>${inExam?'<span class="top-link">جلسه آزمون فعال</span>':`<button class="top-link" data-action="go-home">خانه</button><button class="top-link" data-action="student-login">ورود دانش‌آموز</button><button class="btn btn-primary btn-small" data-action="teacher-login">پنل دبیر</button>`}</div></div></header>`;
  }
  function footer(){return `<footer class="footer"><div class="container footer-inner"><span>© آزمون‌یار — نمونه تعاملی سامانه آزمون مدرسه</span><span class="privacy-chip">${icon('shield')} داده‌های این نسخه فقط در همین مرورگر نگه‌داری می‌شوند.</span></div></footer>`;}
  function page(content){return `${header()}<main class="page"><div class="container">${content}</div></main>${footer()}`;}
  function homeView(){
    const next=db.tests.find(t=>t.published&&statusOf(t)==='open')||db.tests.find(t=>t.published&&statusOf(t)==='scheduled');

  function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function prepareAttempt(test){
    let pool=[...test.questions];if(test.randomQuestionSet)pool=shuffleArray(pool).slice(0,Math.min(Number(test.questionsPerStudent)||pool.length,pool.length));
    if(test.shuffleQuestions)pool=shuffleArray(pool);

    for(const q of pool){if(q.type==='mcq')choiceOrders[q.id]=test.shuffleOptions?shuffleArray(q.options.map(o=>o.id)):q.options.map(o=>o.id);if(q.type==='match')matchOrders[q.id]=shuffleArray(q.pairs.map(p=>p.id));}
    return {questionOrder:pool.map(q=>q.id),choiceOrders,matchOrders};
  }
  function questionById(test,id){return test?.questions.find(q=>q.id===id);}
  function answerComplete(q,answer){if(q.type==='mcq')return !!answer;if(q.type==='fill'||q.type==='essay')return String(answer||'').trim().length>0;if(q.type==='match')return !!answer&&Object.values(answer).some(Boolean);return false;}

  function questionInput(q,attempt){const answer=attempt.answers?.[q.id];
    if(q.type==='mcq'){const order=attempt.choiceOrders?.[q.id]||q.options.map(o=>o.id);return `<div class="answer-options">${order.map(id=>{const option=q.options.find(o=>o.id===id);return `<label class="answer-option"><input type="radio" name="answer-${esc(q.id)}" value="${esc(id)}" data-answer-qid="${esc(q.id)}" ${answer===id?'checked':''}><span>${esc(option?.text||'')}</span></label>`;}).join('')}</div>`;}
    if(q.type==='fill')return `<input class="answer-input" type="text" data-answer-qid="${esc(q.id)}" value="${esc(answer||'')}" placeholder="پاسخ خود را بنویسید…">`;

ady()?'#43c48f':'#d55b52'}"></i> ${cameraReady()?'دوربین فعال':'دوربین قطع است'} · ویدئو ضبط نمی‌شود</div></div><div class="side-panel"><h3>نظارت و راهنما</h3><div class="note warn">رویدادهای فنی ثبت‌شده: <strong>${toFa(events.length)}</strong><br>تغییر زبانه یا قطع دوربین به‌تنهایی اثبات تخلف نیست و باید توسط دبیر بررسی شود.</div><div class="form-actions" style="margin-top:10px"><button class="btn btn-light btn-small" data-action="fullscreen">حالت تمام‌صفحه</button></div></div><div class="side-panel"><h3>یادآوری</h3><p style="font-size:10px;color:var(--muted);margin:0;line-height:1.9">پاسخ‌ها خودکار ذخیره می‌شوند. برای خروج، از دکمه پایان آزمون استفاده کنید.</p></div></aside></div>`);

  function normalizeText(s){return String(s||'').trim().toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,'');}
  function calculateScore(attempt,test){
    const order=attempt.questionOrder||test.questions.map(q=>q.id);let autoScore=0,autoMax=0,manualMax=0,manualScore=0,pendingManual=0;
    for(const id of order){const q=questionById(test,id);if(!q)continue;const answer=attempt.answers?.[id];

  function defaultQDraft(type){if(type==='mcq')return {text:'',points:1,options:['','','',''],correctIndex:'0'};if(type==='fill')return {text:'',points:1,acceptable:''};if(type==='essay')return {text:'',points:2,rubric:''};return {text:'',points:2,pairs:''};}
  function qDraftFields(type,d){const common=`<div class="field"><label>صورت سؤال</label><textarea name="qText" data-q-field="text" placeholder="صورت سؤال را بنویسید…">${esc(d.text||'')}</textarea></div><div class="field" style="max-width:180px"><label>نمره</label><input type="number" name="qPoints" data-q-field="points" min="0.25" step="0.25" value="${esc(d.points||1)}"></div>`;
    if(type==='mcq')return `${common}<div class="field-grid">${[0,1,2,3].map(i=>`<div class="field"><label>گزینه ${toFa(i+1)}</label><input type="text" name="option${i}" data-q-field="option${i}" value="${esc((d.options||[])[i]||'')}" placeholder="متن گزینه"></div>`).join('')}</div><div class="field" style="max-width:220px"><label>گزینه صحیح</label><select name="correctIndex" data-q-field="correctIndex">${[0,1,2,3].map(i=>`<option value="${i}" ${String(d.correctIndex??0)===String(i)?'selected':''}>گزینه ${toFa(i+1)}</option>`).join('')}</select></div>`;
    if(type==='fill')return `${common}<div class="field"><label>پاسخ صحیح <span class="hint">پاسخ‌های جایگزین را با ویرگول جدا کنید</span></label><input name="acceptable" data-q-field="acceptable" value="${esc(d.acceptable||'')}" placeholder="مثلاً فتوسنتز، photosynthesis"></div>`;
    if(type==='essay')return `${common}<div class="field"><label>راهنمای تصحیح برای دبیر <span class="hint">اختیاری</span></label><textarea name="rubric" data-q-field="rubric" placeholder="معیار یا نکته‌های پاسخ…">${esc(d.rubric||'')}</textarea></div>`;
    return `${common}<div class="field"><label>جفت‌ها <span class="hint">هر ردیف: عبارت سمت راست | پاسخ مطابق</span></label><textarea name="pairs" data-q-field="pairs" placeholder="تبخیر | تبدیل مایع به بخار&#10;میعان | تبدیل بخار به مایع">${esc(d.pairs||'')}</textarea></div>`;
  }
  function renderCreateModal(){

    return `<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="ساخت آزمون"><div class="modal-header"><h2>ساخت آزمون جدید</h2><button class="icon-button" data-action="close-modal" aria-label="بستن">×</button></div><form id="testForm"><div class="modal-body"><div class="field-grid"><div class="field"><label>عنوان آزمون</label><input name="title" value="${esc(d.title)}" placeholder="مثلاً آزمون فصل اول" required></div><div class="field"><label>درس / موضوع</label><input name="subject" value="${esc(d.subject)}" placeholder="مثلاً علوم"></div><div class="field"><label>نام کلاس</label><input name="className" value="${esc(d.className)}" placeholder="مثلاً دهم الف" required></div><div class="field"><label>مدت هر دانش‌آموز (دقیقه)</label><input type="number" name="duration" min="1" max="600" value="${esc(d.duration)}" required></div><div class="field"><label>زمان شروع</label><input type="datetime-local" name="startAt" value="${dateTimeLocal(d.startAt)}" required></div><div class="field"><label>زمان پایان بازه آزمون</label><input type="datetime-local" name="endAt" value="${dateTimeLocal(d.endAt)}" required></div></div><div class="switch-grid"><label class="switch-box"><input type="checkbox" name="shuffleQuestions" ${d.shuffleQuestions?'checked':''}><span>ترتیب سؤال‌ها برای هر دانش‌آموز تصادفی باشد</span></label><label class="switch-box"><input type="checkbox" name="shuffleOptions" ${d.shuffleOptions?'checked':''}><span>ترتیب گزینه‌های چهارگزینه‌ای جابه‌جا شود</span></label><label class="switch-box"><input type="checkbox" name="randomQuestionSet" ${d.randomQuestionSet?'checked':''}><span>برای هر نفر، تعدادی سؤال تصادفی از بانک انتخاب شود</span></label></div><div class="field" style="max-width:260px"><label>تعداد سؤال برای هر دانش‌آموز <span class="hint">۰ یعنی همه سؤال‌ها</span></label><input type="number" name="questionsPerStudent" min="0" value="${esc(d.questionsPerStudent)}"></div><label class="switch-box" style="display:inline-flex"><input type="checkbox" name="published" ${d.published?'checked':''}><span>پس از ذخیره، آزمون منتشر شود</span></label><div class="note info" style="margin-top:12px;font-size:10px">برای آزمون استاندارد با سؤال‌های متفاوت، تعداد و نمره/سطح دشواری سؤال‌های بانک را هم‌ارز نگه دارید. در این نسخه، محتوای پاسخ‌نامه در سمت مرورگر قرار دارد و برای آزمون واقعی امن نیست.</div><div class="modal-section-title">افزودن سؤال</div><div class="field" style="max-width:270px"><label>نوع سؤال</label><select id="questionType">${Object.entries(TYPE_LABELS).map(([k,v])=>`<option value="${k}" ${ui.questionType===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="question-editor"><h3>${TYPE_ICONS[ui.questionType]} ${TYPE_LABELS[ui.questionType]}</h3>${qDraftFields(ui.questionType,qd)}<button type="button" class="btn btn-dark btn-small" data-action="add-question">افزودن به آزمون</button></div><div class="modal-section-title">سؤال‌های این آزمون <span class="muted">(${toFa(qs.length)})</span></div>${qs.length?`<div class="question-list">${qs.map((q,i)=>`<div class="draft-q"><div><strong>${toFa(i+1)}. ${TYPE_LABELS[q.type]} · ${toFa(q.points)} نمره</strong><span>${esc(q.text)}</span></div><button type="button" class="btn btn-danger btn-small" data-action="remove-question" data-id="${esc(q.id)}">حذف</button></div>`).join('')}</div>`:`<div class="empty-state" style="padding:15px">برای ذخیره، دست‌کم یک سؤال اضافه کنید.</div>`}<div class="form-actions" style="justify-content:flex-end;margin-top:22px"><button class="btn btn-light" type="button" data-action="close-modal">انصراف</button><button class="btn btn-primary" type="submit">ذخیره آزمون</button></div></div></form></div></div>`;
  }
  function renderTeacher(){
    const tabs=[['overview','نمای کلی'],['tests','آزمون‌ها'],['results','نتایج و پاسخ‌ها'],['monitor','گزارش نظارت']];
    let content=ui.teacherTab==='overview'?renderOverview():ui.teacherTab==='tests'?renderTests():ui.teacherTab==='results'?renderResults():renderMonitor();
    return page(`<div class="teacher-layout"><div class="dashboard-head"><div><h1>پنل دبیر</h1><p>مدیریت آزمون‌ها، کلاس‌ها و گزارش‌ها · نسخه آزمایشی محلی</p></div><button class="btn btn-light btn-small" data-action="teacher-logout">خروج از پنل</button></div><nav class="dash-tabs">${tabs.map(([k,label])=>`<button class="dash-tab ${ui.teacherTab===k?'active':''}" data-tab="${k}">${label}</button>`).join('')}</nav>${content}${ui.modal==='createTest'?renderCreateModal():''}</div>`);
  }
  function render(){
    const views={home:homeView,studentLogin:studentLoginView,teacherLogin:teacherLoginView,studentLobby:studentLobbyView,preflight:preflightView,exam:renderExam,result:resultView,teacher:renderTeacher};
    app.innerHTML=(views[ui.view]||homeView)();attachLiveVideo();
  }
  function attachLiveVideo(){if(!ui.cameraStream)return;app.querySelectorAll('[data-live-video]').forEach(v=>{try{v.srcObject=ui.cameraStream;v.muted=true;v.playsInline=true;const p=v.play();if(p&&p.catch)p.catch(()=>{});}catch(_){}});}
  function stopCamera(){if(ui.cameraStream){ui.cameraStream.getTracks().forEach(t=>t.stop());ui.cameraStream=null;}ui.cameraStatus='idle';}
  function go(view){if(ui.view==='preflight'&&view!=='exam')stopCamera();ui.view=view;render();window.scrollTo({top:0,behavior:'smooth'});}
  function submitStudentLogin(form){const fd=new FormData(form);const nid=toLatin(fd.get('nationalId')||'').replace(/\D/g,'');const first=String(fd.get('firstName')||'').trim();const last=String(fd.get('lastName')||'').trim();const cls=String(fd.get('className')||'').trim();if(nid.length!==10){toast('کد ملی باید دقیقاً ۱۰ رقم باشد.');return;}if(!first||!last||!cls){toast('همه اطلاعات را کامل کنید.');return;}ui.student={nationalId:nid,firstName:first,lastName:last,className:cls};ui.selectedTestId=null;ui.capturedPhoto=null;ui.consent=false;ui.resumeMode=false;go('studentLobby');}
  function cameraErrorMessage(err){if(err?.name==='NotAllowedError'||err?.name==='PermissionDeniedError')return 'اجازه استفاده از دوربین داده نشد.';if(err?.name==='NotFoundError'||err?.name==='DevicesNotFoundError')return 'دوربین در این دستگاه پیدا نشد.';if(err?.name==='NotReadableError')return 'دوربین در برنامه دیگری استفاده می‌شود.';return 'اتصال دوربین ممکن نشد.';}
  async function requestCamera(){if(!ui.consent){toast('ابتدا رضایت ثبت تصویر و پردازش فنی را تأیید کنید.');return;}ui.cameraError='';if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ui.cameraError='مرورگر یا بستر فعلی از دسترسی دوربین پشتیبانی نمی‌کند.';render();return;}try{if(ui.cameraStream)ui.cameraStream.getTracks().forEach(t=>t.stop());ui.cameraStatus='requesting';const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});ui.cameraStream=stream;ui.cameraStatus='ready';ui.cameraError='';stream.getVideoTracks().forEach(track=>track.addEventListener('ended',()=>{ui.cameraStatus='ended';ui.cameraStream=null;if(ui.view==='exam'&&db.activeAttempt)logProctorEvent('قطع یا پایان اتصال دوربین','مرورگر گزارش کرد که مسیر تصویر پایان یافته است.');else render();}));render();}catch(err){ui.cameraStatus='error';ui.cameraError=cameraErrorMessage(err);render();}}
  function capturePhoto(){const video=app.querySelector('[data-live-video]');if(!cameraReady()||!video||!video.videoWidth){toast('پیش‌نمایش دوربین هنوز آماده نیست؛ چند لحظه صبر کنید.');return;}try{const maxW=480,scale=Math.min(1,maxW/video.videoWidth),canvas=document.createElement('canvas');canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);ui.capturedPhoto=canvas.toDataURL('image/jpeg',.68);toast('تصویر ورود ثبت شد.');render();}catch(_){toast('ثبت تصویر ممکن نشد؛ دوباره تلاش کنید.');}}
  function startExam(){const test=findTest(ui.selectedTestId);if(!test){toast('آزمون پیدا نشد.');return;}if(statusOf(test)!=='open'){toast('این آزمون در حال حاضر در بازه برگزاری نیست.');return;}if(!ui.consent||!cameraReady()||!(ui.capturedPhoto||(ui.resumeMode&&db.activeAttempt?.photo))){toast('برای ورود، رضایت، دوربین فعال و تصویر ثبت‌شده لازم است.');return;}
    if(ui.resumeMode&&db.activeAttempt&&db.activeAttempt.testId===test.id){if(db.activeAttempt.endsAt<=now()){finalizeAttempt(true);return;}db.activeAttempt.events=db.activeAttempt.events||[];db.activeAttempt.events.push({type:'ادامه آزمون پس از بازگشت',at:now(),details:'اتصال دوربین دوباره فعال شد.'});ui.activeAttempt=db.activeAttempt;saveDB();}
    else{if(db.activeAttempt){toast('یک آزمون نیمه‌تمام در جریان است؛ ابتدا همان را ادامه دهید.');return;}const setup=prepareAttempt(test);const started=now();const hardEnd=Math.min(started+Number(test.duration)*60000,test.endAt||started+Number(test.duration)*60000);db.activeAttempt={id:'live-'+started+'-'+Math.random().toString(36).slice(2,7),testId:test.id,student:{...ui.student},startedAt:started,endsAt:hardEnd,photo:ui.capturedPhoto,events:[],answers:{},flags:[],manualGrades:{},...setup};ui.activeAttempt=db.activeAttempt;saveDB();}
    ui.currentIndex=0;ui.resumeMode=false;ui.view='exam';render();window.scrollTo(0,0);
  }
  function logProctorEvent(type,details){const a=db.activeAttempt;if(!a)return;const t=now();if(t-ui.lastProctorEvent<2500)return;ui.lastProctorEvent=t;a.events=a.events||[];a.events.push({type,at:t,details:details||''});saveDB();if(ui.view==='exam')render();}
  function finalizeAttempt(auto){const active=db.activeAttempt;if(!active)return;const test=findTest(active.testId);if(!test){db.activeAttempt=null;saveDB();go('home');return;}const score=calculateScore(active,test);const completed={...active,submittedAt:now(),autoSubmitted:!!auto,manualGrades:{},autoScore:score.autoScore,autoMax:score.autoMax,totalMax:score.max,status:'submitted'};db.attempts.unshift(completed);db.activeAttempt=null;saveDB();ui.resultAttemptId=completed.id;ui.activeAttempt=null;ui.resumeMode=false;if(ui.cameraStream){ui.cameraStream.getTracks().forEach(t=>t.stop());ui.cameraStream=null;ui.cameraStatus='idle';}ui.view='result';render();window.scrollTo(0,0);}
  function saveCurrentAnswer(target){const a=db.activeAttempt;if(!a||ui.view!=='exam')return;const qid=target.getAttribute('data-answer-qid');if(!qid)return;const test=findTest(a.testId),q=questionById(test,qid);if(!q)return;
    if(q.type==='match'){const ans={...(a.answers[qid]||{})};app.querySelectorAll(`[data-match-qid="${qid}"]`).forEach(sel=>{const left=sel.getAttribute('data-left-id');if(sel.value)ans[left]=sel.value;else delete ans[left];});a.answers[qid]=ans;}
    else if(q.type==='mcq'){const selected=app.querySelector(`input[name="answer-${qid}"]:checked`);if(selected)a.answers[qid]=selected.value;}
    else a.answers[qid]=target.value;
    saveDB();const status=app.querySelector('#saveStatus');if(status)status.textContent='ذخیره شد';const count=app.querySelector('#answeredCount');if(count)count.textContent=toFa((a.questionOrder||[]).filter(id=>answerComplete(questionById(test,id),a.answers[id])).length);
    app.querySelectorAll('.question-nav button').forEach((b,i)=>{const id=a.questionOrder[i];b.classList.toggle('answered',answerComplete(questionById(test,id),a.answers[id]));});
  }
  function collectMeta(){const form=document.getElementById('testForm');if(!form)return ui.testDraft;const fd=new FormData(form);const start=new Date(String(fd.get('startAt')||'')).getTime(),end=new Date(String(fd.get('endAt')||'')).getTime();return {...ui.testDraft,title:String(fd.get('title')||'').trim(),subject:String(fd.get('subject')||'').trim(),className:String(fd.get('className')||'').trim(),duration:Number(fd.get('duration')),startAt:start,endAt:end,published:fd.has('published'),shuffleQuestions:fd.has('shuffleQuestions'),shuffleOptions:fd.has('shuffleOptions'),randomQuestionSet:fd.has('randomQuestionSet'),questionsPerStudent:Number(fd.get('questionsPerStudent')||0)};}
  function addQuestionFromForm(){const d=collectMeta();if(!d)return;const type=ui.questionType,fd=new FormData(document.getElementById('testForm'));const text=String(fd.get('qText')||'').trim(),points=Number(fd.get('qPoints')||1);if(!text){toast('صورت سؤال را وارد کنید.');return;}if(!Number.isFinite(points)||points<=0){toast('نمره سؤال باید بیشتر از صفر باشد.');return;}const id='q-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);let q={id,type,text,points};
    if(type==='mcq'){const raw=[0,1,2,3].map(i=>String(fd.get('option'+i)||'').trim());const good=raw.map((v,i)=>v?i:-1).filter(i=>i>=0);if(good.length<2){toast('برای چهارگزینه‌ای دست‌کم دو گزینه بنویسید.');return;}const correct=Number(fd.get('correctIndex')||0);if(!raw[correct]){toast('گزینه صحیح را از بین گزینه‌های تکمیل‌شده انتخاب کنید.');return;}q.options=raw.map((text,i)=>text?{id:id+'-o'+i,text}:null).filter(Boolean);q.correctId=id+'-o'+correct;}
    else if(type==='fill'){const vals=String(fd.get('acceptable')||'').split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);if(!vals.length){toast('پاسخ صحیح را وارد کنید.');return;}q.acceptable=vals;}
    else if(type==='essay'){q.rubric=String(fd.get('rubric')||'').trim();}
    else{const pairs=String(fd.get('pairs')||'').split(/\n/).map(line=>line.split('|').map(x=>x.trim())).filter(x=>x.length>=2&&x[0]&&x[1]);if(pairs.length<2){toast('برای جورکردنی دست‌کم دو جفت با علامت | وارد کنید.');return;}q.pairs=pairs.map((p,i)=>({id:id+'-p'+i,left:p[0],right:p[1]}));}
    d.questions=[...(d.questions||[]),q];ui.testDraft=d;ui.qDraft=defaultQDraft(type);render();toast('سؤال به آزمون اضافه شد.');
  }
  function saveTest(form){const d=collectMeta();if(!d.title||!d.className){toast('عنوان آزمون و کلاس را کامل کنید.');return;}if(!Number.isFinite(d.startAt)||!Number.isFinite(d.endAt)||d.endAt<=d.startAt){toast('زمان پایان باید بعد از زمان شروع باشد.');return;}if(!Number.isFinite(d.duration)||d.duration<1){toast('مدت آزمون معتبر نیست.');return;}if(!d.questions?.length){toast('برای ذخیره، دست‌کم یک سؤال اضافه کنید.');return;}if(d.randomQuestionSet&&(!d.questionsPerStudent||d.questionsPerStudent<1)){toast('تعداد سؤال تصادفی را بیشتر از صفر تعیین کنید.');return;}const test={...d,id:'test-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)};db.tests.unshift(test);saveDB();ui.testDraft=null;ui.modal=null;ui.teacherTab='tests';render();toast('آزمون ذخیره شد.');}
  function removeQuestion(id){if(!ui.testDraft)return;ui.testDraft.questions=ui.testDraft.questions.filter(q=>q.id!==id);render();}
  function openTeacher(){ui.view='teacherLogin';render();}
  function startResume(){const a=db.activeAttempt;if(!a){toast('آزمون نیمه‌تمامی پیدا نشد.');return;}if(a.endsAt<=now()){ui.resultAttemptId=null;finalizeAttempt(true);return;}ui.student=a.student;ui.selectedTestId=a.testId;ui.capturedPhoto=a.photo;ui.resumeMode=true;ui.consent=false;ui.cameraError='';ui.view='preflight';render();}
  function init(){document.addEventListener('visibilitychange',()=>{if(document.hidden&&ui.view==='exam'){logProctorEvent('پنهان‌شدن صفحه یا تغییر زبانه','مرورگر گزارش کرد که صفحه آزمون از دید خارج شد.');if(db.activeAttempt&&db.activeAttempt.endsAt<=now())finalizeAttempt(true);}});document.addEventListener('fullscreenchange',()=>{if(ui.view==='exam'&&ui.hadFullscreen&&!document.fullscreenElement)logProctorEvent('خروج از حالت تمام‌صفحه','پس از فعال‌سازی حالت تمام‌صفحه از آن خارج شدید.');});
    app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='studentLoginForm')submitStudentLogin(e.target);else if(e.target.id==='teacherLoginForm'){const code=toLatin(new FormData(e.target).get('teacherCode')||'');if(code==='2468'){ui.teacherLogged=true;ui.teacherTab='overview';go('teacher');}else toast('رمز دمو نادرست است.');}else if(e.target.id==='testForm')saveTest(e.target);});
    app.addEventListener('input',e=>{if(ui.view==='exam'&&e.target.matches('[data-answer-qid]'))saveCurrentAnswer(e.target);});
    app.addEventListener('change',e=>{if(e.target.matches('[data-consent]')){ui.consent=e.target.checked;render();return;}if(ui.view==='exam'&&e.target.matches('[data-answer-qid]'))saveCurrentAnswer(e.target);if(e.target.id==='questionType'){ui.testDraft=collectMeta();ui.questionType=e.target.value;ui.qDraft=defaultQDraft(ui.questionType);render();return;}});
    app.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){ui.teacherTab=tab.dataset.tab;ui.selectedAttemptId=null;render();return;}const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;if(action==='modal-backdrop'){if(e.target===btn){ui.modal=null;ui.testDraft=null;render();}return;}e.preventDefault();
      if(action==='go-home'){if(ui.view==='preflight')stopCamera();if(ui.view==='teacher'&&ui.teacherLogged){ui.view='home';ui.teacherLogged=false;}else ui.view='home';render();}
      else if(action==='student-login'){if(ui.view==='preflight')stopCamera();ui.student=null;ui.view='studentLogin';render();}
      else if(action==='teacher-login'){if(ui.view==='preflight')stopCamera();openTeacher();}
      else if(action==='teacher-logout'){ui.teacherLogged=false;ui.selectedAttemptId=null;ui.view='home';render();}
      else if(action==='back-to-lobby'){stopCamera();ui.view=ui.student?'studentLobby':'home';ui.cameraError='';render();}
      else if(action==='request-camera'){await requestCamera();}
      else if(action==='capture-photo'){capturePhoto();}
      else if(action==='select-test'){const t=findTest(btn.dataset.id);if(!t||statusOf(t)!=='open'){toast('آزمون در حال حاضر باز نیست.');return;}ui.selectedTestId=t.id;ui.capturedPhoto=null;ui.consent=false;ui.resumeMode=false;ui.cameraError='';ui.view='preflight';render();}
      else if(action==='start-exam'){startExam();}
      else if(action==='resume-active'){startResume();}
      else if(action==='open-create'){ui.modal='createTest';ui.testDraft=defaultTestDraft();ui.questionType='mcq';ui.qDraft=defaultQDraft('mcq');render();}
      else if(action==='close-modal'){ui.modal=null;ui.testDraft=null;render();}
      else if(action==='add-question'){addQuestionFromForm();}
      else if(action==='remove-question'){ui.testDraft=collectMeta();removeQuestion(btn.dataset.id);}
      else if(action==='toggle-test'){const t=findTest(btn.dataset.id);if(t){t.published=!t.published;saveDB();render();toast(t.published?'آزمون منتشر شد.':'انتشار آزمون لغو شد.');}}
      else if(action==='delete-test'){const t=findTest(btn.dataset.id);if(t&&confirm(`آزمون «${t.title}» حذف شود؟`)){db.tests=db.tests.filter(x=>x.id!==t.id);saveDB();render();toast('آزمون حذف شد.');}}
      else if(action==='test-results'){ui.teacherTab='results';ui.selectedAttemptId=null;render();}
      else if(action==='view-attempt'){ui.teacherTab='results';ui.selectedAttemptId=btn.dataset.id;render();}
      else if(action==='back-results'){ui.selectedAttemptId=null;render();}
      else if(action==='delete-attempt'){const a=getAttempt(btn.dataset.id);if(a&&confirm('پاسخ‌ها و تصویر ثبت‌شده این دانش‌آموز حذف شود؟')){db.attempts=db.attempts.filter(x=>x.id!==a.id);saveDB();ui.selectedAttemptId=null;render();toast('پاسخ و تصویر حذف شد.');}}
      else if(action==='save-grades'){const a=getAttempt(btn.dataset.id),test=a&&findTest(a.testId);if(!a||!test)return;let invalid=false;app.querySelectorAll('[data-grade-qid]').forEach(input=>{const q=questionById(test,input.dataset.gradeQid),raw=input.value;if(raw===''){delete a.manualGrades[input.dataset.gradeQid];return;}const n=Number(raw);if(!Number.isFinite(n)||n<0||n>Number(q.points)){invalid=true;return;}a.manualGrades[input.dataset.gradeQid]=n;});if(invalid){toast('نمره تشریحی باید در بازه صفر تا نمره سؤال باشد.');return;}saveDB();render();toast('نمره‌ها ذخیره شدند.');}
      else if(action==='jump-question'){ui.currentIndex=Number(btn.dataset.index)||0;render();}
      else if(action==='prev-question'){ui.currentIndex=Math.max(0,ui.currentIndex-1);render();}
      else if(action==='next-question'){const total=db.activeAttempt?.questionOrder?.length||1;ui.currentIndex=Math.min(total-1,ui.currentIndex+1);render();}
      else if(action==='flag-current'){const a=db.activeAttempt;if(a){const id=a.questionOrder[ui.currentIndex];a.flags=a.flags||[];a.flags=a.flags.includes(id)?a.flags.filter(x=>x!==id):[...a.flags,id];saveDB();render();}}
      else if(action==='submit-exam'){if(confirm('پاسخ‌ها ثبت و آزمون پایان داده شود؟ پس از ثبت امکان ویرایش وجود ندارد.'))finalizeAttempt(false);}
      else if(action==='fullscreen'){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();ui.hadFullscreen=true;}else await document.exitFullscreen();}catch(_){toast('مرورگر اجازه تمام‌صفحه نمی‌دهد.');}}
      else if(action==='open-result'){ui.resultAttemptId=btn.dataset.id;ui.view='result';render();}
    });
    render();setInterval(()=>{if(ui.view==='exam'&&db.activeAttempt){const remaining=db.activeAttempt.endsAt-now();const node=document.getElementById('timerValue'),pill=document.getElementById('timerPill');if(node)node.textContent=formatRemain(remaining);if(pill)pill.classList.toggle('urgent',remaining<5*60*1000);if(remaining<=0)finalizeAttempt(true);}},1000);
  }
  init();
  </script>
</body>
</html>
